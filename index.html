<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>as the hydra</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@200..700&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared/design.css" />

    <style>
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: var(--s-6);
      }
      .lobby {
        max-width: 30rem;
        text-align: left;
      }
      .wordmark {
        font-family: var(--font-display);
        font-size: clamp(3rem, 12vw, 5rem);
        line-height: 0.9;
        margin: 0 0 var(--s-5);
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: var(--s-3);
        margin-top: var(--s-6);
      }
      .nav a {
        font-family: var(--font-mono);
        font-size: 0.92rem;
        text-transform: lowercase;
        text-decoration: none;
        color: var(--text-primary);
        border-top: 1px solid var(--border-light);
        padding-top: var(--s-3);
      }
      .nav a:hover {
        opacity: 0.7;
      }
      .copy {
        font-family: var(--font-body);
        font-size: 1.05rem;
        line-height: 1.6;
        color: var(--text-secondary);
        max-width: 32ch;
        margin: 0;
      }
    </style>

    <script>
      // qr links land on /participant.html?session=...
      // bare / lands here. forward to participant if a session is named, else show lobby.
      const p = new URLSearchParams(location.search);
      if (p.get("session")) {
        location.replace("participant.html?" + p.toString());
      }
    </script>
  </head>
  <body>
    <main class="lobby">
      <h1 class="wordmark">as the hydra</h1>
      <p class="copy">
        a participatory branching - read aloud, in turn. one screen, many
        voices.
      </p>
      <nav class="nav">
        <a href="participant.html">join the cast</a>
        <a href="watch.html">watch along</a>
        <a href="host.html">host view</a>
        <a href="admin.html">admin</a>
      </nav>
    </main>
  </body>
</html>

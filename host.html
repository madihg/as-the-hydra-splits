<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>as the hydra - host</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@200..700&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared/design.css" />

    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      .host {
        display: grid;
        grid-template-columns: minmax(360px, 38vw) 1fr;
        grid-template-rows: auto 1fr;
        height: 100vh;
        max-height: 100vh;
      }

      .doc-head {
        grid-column: 1 / -1;
        border-bottom: 4px solid var(--border);
        padding: var(--s-5) var(--s-6) var(--s-4);
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: var(--s-6);
      }
      .doc-head .wordmark {
        font-family: var(--font-display);
        font-size: clamp(2.4rem, 5vw, 4.2rem);
        line-height: 0.9;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .doc-head .meta {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        color: var(--text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-align: right;
        line-height: 1.6;
      }
      .doc-head .meta b {
        color: var(--text-primary);
        font-weight: 700;
      }

      .lines {
        border-right: 1px solid var(--border-light);
        padding: var(--s-6);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .lines-empty {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-tertiary);
        padding: var(--s-5) 0;
      }
      .line-item {
        border-top: 1px solid var(--border-light);
        padding: var(--s-5) 0;
        animation: line-in 600ms ease both;
      }
      .line-item:first-child {
        border-top: 0;
      }
      .line-item .text {
        font-family: var(--font-body);
        font-size: clamp(1rem, 1.4vw, 1.25rem);
        line-height: 1.45;
        color: var(--text-primary);
        white-space: pre-line;
        margin: 0 0 var(--s-3);
      }
      .line-item .direction {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        font-style: italic;
        color: var(--text-tertiary);
        line-height: 1.5;
      }
      .line-item .voice {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-hint);
        margin-bottom: var(--s-2);
      }
      @keyframes line-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .tree-pane {
        position: relative;
        overflow: hidden;
      }
      #tree-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* small toggle button in upper-right - the only resting state */
      .qr-toggle {
        position: absolute;
        top: var(--s-5);
        right: var(--s-5);
        background: #fff;
        border: 1px solid var(--border);
        padding: 0.6rem 0.9rem;
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-primary);
        transition:
          opacity 1.5s ease,
          border-color 0.2s ease,
          background 0.2s ease;
      }
      .qr-toggle:hover {
        background: #000;
        color: #fff;
        border-color: #000;
      }
      .qr-toggle:focus-visible {
        outline: 3px solid var(--hard);
        outline-offset: 3px;
      }
      .qr-toggle.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .qr-toggle .qr-glyph {
        display: inline-grid;
        grid-template-columns: repeat(7, 2px);
        grid-template-rows: repeat(7, 2px);
        gap: 1px;
        width: 18px;
        height: 18px;
      }
      .qr-toggle .qr-glyph i {
        background: currentColor;
      }
      .qr-toggle .remaining {
        font-variant-numeric: tabular-nums;
        opacity: 0.7;
      }

      /* fullscreen qr overlay */
      .qr-overlay {
        position: fixed;
        inset: 0;
        background: #fff;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--s-6);
        padding: var(--s-6);
        cursor: zoom-out;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .qr-overlay.visible {
        display: flex;
        opacity: 1;
      }
      .qr-overlay #qr-big {
        width: min(80vmin, 720px);
        height: min(80vmin, 720px);
      }
      .qr-overlay #qr-big img,
      .qr-overlay #qr-big canvas {
        width: 100% !important;
        height: 100% !important;
      }
      .qr-overlay .qr-url {
        font-family: var(--font-mono);
        font-size: clamp(0.85rem, 1.4vw, 1.05rem);
        color: var(--text-secondary);
        text-align: center;
        word-break: break-all;
        max-width: 90vw;
        user-select: all;
      }
      .qr-overlay .qr-caption {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-tertiary);
      }
      .qr-overlay .qr-close {
        position: absolute;
        top: var(--s-5);
        right: var(--s-5);
        font-family: var(--font-mono);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
        background: transparent;
        border: 1px solid var(--border-light);
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
      .qr-overlay .qr-close:hover {
        opacity: 0.7;
        border-color: var(--border);
      }

      .closing {
        position: absolute;
        bottom: var(--s-6);
        left: 50%;
        transform: translateX(-50%);
        font-family: var(--font-display);
        font-size: clamp(1.6rem, 3vw, 2.4rem);
        color: var(--text-primary);
        opacity: 0;
        transition: opacity 2s ease;
        white-space: nowrap;
      }
      .closing.visible {
        opacity: 0.85;
      }

      .idle-card {
        position: absolute;
        top: var(--s-5);
        right: var(--s-5);
        background: #fff;
        border: 1px solid var(--border-light);
        padding: var(--s-4) var(--s-5);
        font-family: var(--font-mono);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        max-width: 220px;
        line-height: 1.5;
      }
      .idle-card a {
        color: var(--text-primary);
      }
    </style>
  </head>
  <body>
    <main class="host">
      <header class="doc-head">
        <h1 class="wordmark">Splitting</h1>
        <div class="meta">
          <span id="meta-status">no session</span><br />
          <b id="meta-progress">voices &middot; 0 / 14</b><br />
          <span id="meta-stamp"></span>
        </div>
      </header>

      <aside class="lines" id="lines-col">
        <div class="lines-empty" id="lines-empty">
          waiting for the first voice
        </div>
      </aside>

      <section class="tree-pane">
        <canvas id="tree-canvas"></canvas>

        <button
          type="button"
          class="qr-toggle hidden"
          id="qr-toggle"
          aria-label="show qr code for participants to scan"
        >
          <span class="qr-glyph" aria-hidden="true">
            <!-- 7x7 grid: three corner finder squares, the universal qr signature -->
            <i style="grid-area: 1/1"></i><i style="grid-area: 1/2"></i
            ><i style="grid-area: 1/3"></i><i style="grid-area: 1/5"></i
            ><i style="grid-area: 1/6"></i><i style="grid-area: 1/7"></i>
            <i style="grid-area: 2/1"></i><i style="grid-area: 2/3"></i
            ><i style="grid-area: 2/5"></i><i style="grid-area: 2/7"></i>
            <i style="grid-area: 3/1"></i><i style="grid-area: 3/2"></i
            ><i style="grid-area: 3/3"></i><i style="grid-area: 3/5"></i
            ><i style="grid-area: 3/6"></i><i style="grid-area: 3/7"></i>
            <i style="grid-area: 4/4"></i>
            <i style="grid-area: 5/1"></i><i style="grid-area: 5/2"></i
            ><i style="grid-area: 5/3"></i><i style="grid-area: 5/5"></i>
            <i style="grid-area: 6/1"></i><i style="grid-area: 6/3"></i
            ><i style="grid-area: 6/7"></i> <i style="grid-area: 7/1"></i
            ><i style="grid-area: 7/2"></i><i style="grid-area: 7/3"></i
            ><i style="grid-area: 7/4"></i><i style="grid-area: 7/6"></i>
          </span>
          <span>show qr</span>
          <span class="remaining"
            >&middot; <span id="qr-remaining">14</span>&nbsp;left</span
          >
        </button>

        <div class="qr-overlay" id="qr-overlay" role="dialog" aria-modal="true">
          <button
            type="button"
            class="qr-close"
            id="qr-close"
            aria-label="close enlarged qr"
          >
            close &times;
          </button>
          <div id="qr-big"></div>
          <div class="qr-url" id="qr-url"></div>
          <div class="qr-caption">tap or press esc to close</div>
        </div>

        <div class="idle-card" id="idle-card" style="display: none">
          no session in progress.<br />
          open <a href="admin.html">/admin</a> to begin.
        </div>

        <div class="closing" id="closing">here the hydra splits</div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script type="module" src="host.js"></script>
  </body>
</html>
